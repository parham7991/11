<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#386bf9" />
    <title>آفلند — آفلاین</title>
    <style>
      :root {
        --c1: #386bf9;
        --c2: #6f3cf5;
        --ink: #182235;
        --muted: #667085;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
        background: #f5f7fc;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        width: min(440px, 100%);
        background: #fff;
        border: 1px solid #e6ebf5;
        border-radius: 28px;
        padding: 36px 28px 30px;
        box-shadow: 0 24px 80px rgba(20, 35, 80, 0.1);
      }
      .badge {
        width: 64px; height: 64px;
        margin: 0 auto 18px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        display: grid; place-items: center;
        color: #fff;
        box-shadow: 0 15px 32px rgba(56, 107, 249, 0.28);
      }
      .badge svg { width: 36px; height: 36px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.9; color: var(--muted); margin: 0 0 22px; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button {
        height: 44px; padding: 0 20px; border: 0; border-radius: 14px;
        font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
      }
      .primary { background: var(--c1); color: #fff; box-shadow: 0 10px 24px rgba(56, 107, 249, 0.25); }
      .ghost { background: #eef2fb; color: #334155; }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.8" />
          <rect x="10" y="10" width="4" height="4" rx=".5" stroke="currentColor" stroke-width="1.8" />
          <path d="M9 4v3M12 4v3M15 4v3M9 17v3M12 17v3M15 17v3M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </div>
      <h1>اینترنت قطع شد</h1>
      <p>اتصال شما به اینترنت برقرار نیست. وقتی دوباره آنلاین شوید، قیمت و موجودی به‌روز می‌شود. بخش‌های قبلاً بازدید شده همچنان در دسترس‌اند.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">تلاش دوباره</button>
        <button class="ghost" onclick="location.href='/'">رفتن به خانه</button>
      </div>
    </main>
  </body>
</html>
